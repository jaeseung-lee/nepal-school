<!doctype html><html lang="ko"><meta charset="utf-8"><style>body{font:14px sans-serif;margin:20px;color:#181a1f;background:#fcfaf5}h1{font-size:18px;color:#174ea6}button,a{display:inline-block;padding:10px 14px;border:0;border-radius:8px;color:white;background:#174ea6;margin:5px 5px 8px 0;text-decoration:none}textarea{width:100%;height:130px;box-sizing:border-box;font:12px monospace}#error{color:#a85b38}</style><h1>유학생 도입 체계</h1><p id="status">도식 구성 중</p><div id="downloads"></div><textarea id="report" aria-label="구성 결과" readonly></textarea><p id="error"></p><script>
window.onmessage=event=>{const p=event.data.pluginMessage;if(!p)return;if(p.type==='error'){document.getElementById('error').textContent=p.message;document.getElementById('status').textContent='구성 오류';return;}if(p.type==='result'){const v=p.validation;document.getElementById('status').textContent='완료 · '+v.frame.id+' · '+v.frame.width+' × '+v.frame.height+' · 넘침 '+v.overflow.length+'개';document.getElementById('report').value=JSON.stringify(v,null,2);for(const [ext,bytes,mime] of [['png',p.png,'image/png'],['svg',p.svg,'image/svg+xml'],['json',new TextEncoder().encode(JSON.stringify(v,null,2)),'application/json']]){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([new Uint8Array(bytes)],{type:mime}));a.download='08-student-admission-system.'+ext;a.textContent=ext.toUpperCase()+' 저장';document.getElementById('downloads').appendChild(a);}const a=document.createElement('a');a.href='https://www.figma.com/design/WjWhtE25116IaGXslTO3xv?node-id='+v.frame.id.replace(':','-');a.textContent='Figma 도식 열기';a.target='_blank';document.getElementById('downloads').appendChild(a);}};
</script></html>
